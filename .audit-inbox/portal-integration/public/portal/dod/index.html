<!DOCTYPE html>
<!-- @see docs/portal-foundation.md -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOD Review · FactoryWager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/portal/style.css" />
  <style>
    .hidden { display: none; }
    .dod-dashboard { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .dod-filters { display: flex; gap: 8px; margin-bottom: 20px; }
    .dod-filter { padding: 4px 14px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text-dim); cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
    .dod-filter.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
    .dod-filter.flagged { border-color: var(--red); color: var(--red); }
    .dod-filter.flagged.active { background: rgba(248,81,73,.15); }
    .dod-list { display: flex; flex-direction: column; gap: 12px; }
    .dod-card { display: flex; gap: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; align-items: flex-start; }
    .dod-card.flagged { border-color: var(--red); }
    .dod-card.verified { border-color: var(--green); }
    .dod-card.rejected { opacity: .6; }
    .dod-preview img { width: 180px; height: auto; border-radius: 4px; background: var(--surface-hover); }
    .dod-details { flex: 1; font-size: 13px; line-height: 1.6; }
    .dod-details p { margin: 2px 0; }
    .dod-actions { display: flex; flex-direction: column; gap: 8px; }
    .dod-actions button { padding: 6px 14px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-approve { background: rgba(46,204,113,.15); color: var(--green); border: 1px solid var(--green); }
    .btn-approve:hover { background: var(--green); color: var(--bg); }
    .btn-reject { background: rgba(231,76,60,.15); color: var(--red); border: 1px solid var(--red); }
    .btn-reject:hover { background: var(--red); color: var(--bg); }
    .tamper-badge { font-size: 12px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
    .tamper-low { background: rgba(46,204,113,.15); color: var(--green); }
    .tamper-high { background: rgba(231,76,60,.15); color: var(--red); }
    .reject-reason { margin-top: 8px; padding: 8px; background: var(--surface-hover); border-radius: 4px; font-size: 12px; color: var(--text-dim); }
    @media (max-width: 768px) { .dod-card { flex-direction: column; } .dod-preview img { width: 100%; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="logo">
        <span class="logo-icon">■</span>
        <span class="brand-wordmark">FactoryWager</span>
        <span class="brand-badge">ops</span>
        <span class="logo-page">DOD</span>
      </h1>
      <nav class="topbar-nav" aria-label="Primary">
        <a href="/" class="nav-link">Home</a>
        <a href="/portal/ops" class="nav-link">Ops</a>
        <a href="/portal/" class="nav-link">Registry</a>
        <a href="/portal/health" class="nav-link">Health</a>
        <a href="/portal/dod" class="nav-link active">DOD</a>
        <div class="nav-overflow">
          <button type="button" class="nav-more" aria-label="More navigation" aria-expanded="false" aria-haspopup="true">⋯</button>
          <div class="nav-dropdown" role="menu">
            <a href="/portal/catalog" class="nav-link" role="menuitem">Catalog</a>
            <a href="/portal/skills" class="nav-link" role="menuitem">Skills</a>
            <a href="/portal/env" class="nav-link" role="menuitem">Env</a>
            <a href="/portal/dashboard" class="nav-link" role="menuitem">Dashboard</a>
            <a href="/monitoring" class="nav-link" role="menuitem">Monitoring</a>
            <a href="https://wiki.factory-wager.com" class="nav-link" target="_blank" rel="noopener noreferrer" role="menuitem">Wiki</a>
          </div>
        </div>
      </nav>
      <div class="topbar-status">
        <a href="/portal/dod.md" class="nav-link nav-md" title="Markdown view">MD</a>
        <a href="/portal/health" class="topbar-health-link" title="System health">
          <span id="health-dot" class="health-dot unknown"></span>
          <span id="health-label" class="health-label">…</span>
        </a>
      </div>
    </div>
  </header>

  <main class="dod-dashboard">
    <div id="loading" class="ops-loading"><div class="spinner"></div><p>Loading DOD queue…</p></div>
    <div id="dashboard" class="hidden">
      <div class="dod-filters" id="dod-filters"></div>
      <div class="dod-list" id="dod-list"></div>
    </div>
  </main>

  <script type="module">
    const $ = id => document.getElementById(id);
    let entries = [];
    let currentFilter = 'flagged';

    async function load(status = 'flagged') {
      currentFilter = status;
      $('loading').classList.remove('hidden');
      $('dashboard').classList.add('hidden');
      try {
        const res = await fetch('/api/dod?status=' + status);
        const data = await res.json();
        entries = Array.isArray(data) ? data : [];
        if (!Array.isArray(data)) console.warn('[dod] unexpected API shape:', data);
        render();
      } catch {
        entries = [];
        render();
      }
    }

    function render() {
      $('loading').classList.add('hidden');
      $('dashboard').classList.remove('hidden');
      renderFilters();
      renderList();
    }

    function renderFilters() {
      const statuses = ['flagged', 'pending', 'verified', 'rejected', 'all'];
      $('dod-filters').innerHTML = statuses.map(s => `
        <button class="dod-filter ${s} ${currentFilter === s ? 'active' : ''}" data-status="${s}">
          ${s.toUpperCase()}${s === 'flagged' ? ` (${entries.filter(e => e.status === 'flagged').length})` : ''}
        </button>
      `).join('');
      $('dod-filters').querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => load(btn.dataset.status));
      });
    }

    function renderList() {
      $('dod-list').innerHTML = entries.length
        ? entries.map(e => `
          <div class="dod-card ${e.status}">
            <div class="dod-preview">
              ${e.s3_path ? `<img src="/evidence/${e.s3_path}" alt="DOD evidence" loading="lazy" />` : '<div style="width:180px;height:120px;background:var(--surface-hover);display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:12px">No image</div>'}
              <span class="tamper-badge ${e.tamper_score > 50 ? 'tamper-high' : 'tamper-low'}" style="display:block;margin-top:6px;text-align:center">Tamper: ${e.tamper_score}/100</span>
            </div>
            <div class="dod-details">
              <p><strong>ID:</strong> <code>${(e.id || '').slice(0, 8)}</code></p>
              <p><strong>Agent:</strong> <code>${(e.agent_id || '').slice(0, 8)}</code></p>
              <p><strong>Type:</strong> ${e.type}</p>
              <p><strong>Submitted:</strong> ${e.submitted_at ? new Date(e.submitted_at).toLocaleString() : '—'}</p>
              ${e.extracted_text ? `<p><strong>OCR:</strong> ${e.extracted_text.slice(0, 120)}…</p>` : ''}
              ${e.geo_lat ? `<p>📍 ${e.geo_lat.toFixed(4)}, ${e.geo_lng.toFixed(4)}</p>` : ''}
              ${e.device_model ? `<p>📱 ${e.device_model}</p>` : ''}
              ${e.signature ? `<p>🔏 <code>${e.signature.slice(0, 16)}...</code></p>` : ''}
              ${e.rejection_reason ? `<div class="reject-reason">🚫 ${e.rejection_reason}</div>` : ''}
            </div>
            ${e.status !== 'verified' && e.status !== 'rejected' ? `
              <div class="dod-actions">
                <button class="btn-approve" data-id="${e.id}">✓ Approve</button>
                <button class="btn-reject" data-id="${e.id}">✗ Reject</button>
              </div>
            ` : ''}
          </div>
        `).join('')
        : '<div style="text-align:center;padding:60px;color:var(--text-dim)">No DODs in this queue.</div>';

      // Wire approve/reject buttons
      $('dod-list').querySelectorAll('.btn-approve').forEach(btn => {
        btn.addEventListener('click', async () => {
          await fetch('/api/dod/approve', { method: 'POST', body: JSON.stringify({ id: btn.dataset.id }) });
          load(currentFilter);
        });
      });
      $('dod-list').querySelectorAll('.btn-reject').forEach(btn => {
        btn.addEventListener('click', async () => {
          const reason = prompt('Rejection reason:');
          if (!reason) return;
          await fetch('/api/dod/reject', { method: 'POST', body: JSON.stringify({ id: btn.dataset.id, reason }) });
          load(currentFilter);
        });
      });
    }

    load();
  </script>
  <script type="module" src="/portal/data.js"></script>
  <script type="module" src="/portal/topbar.js"></script>
</body>
</html>
