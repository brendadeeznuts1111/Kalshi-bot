<!DOCTYPE html>
<!-- @see docs/portal-foundation.md -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operations · FactoryWager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/portal/style.css" />
  <style>
    .ops-dashboard { padding: 0 24px; }
    .ops-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .ops-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .ops-panel.wide { grid-column: span 2; }
    .ops-panel h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }
    .ops-metric { font-size: 28px; font-weight: 600; }
    .ops-metric.ok { color: var(--green, #3fb950); }
    .ops-metric.bad { color: var(--red, #f85149); }
    .ops-sub { font-size: 12px; color: var(--text-dim); margin: 6px 0 10px; }
    .ops-mono { font-size: 11px; color: var(--text-dim); word-break: break-all; margin-bottom: 8px; }
    .ops-link { font-size: 12px; color: var(--accent); }
    .ops-chart { display: block; margin-top: 10px; border-radius: 6px; border: 1px solid var(--border); max-height: 160px; object-fit: contain; background: #0d1117; }
    .ops-panel ul { list-style: none; padding: 0; }
    .ops-panel li {
      padding: 6px 0;
      border-bottom: 1px solid rgba(48,54,61,.4);
      display: flex; justify-content: space-between;
      font-size: 13px;
    }
    .ops-panel li small { color: var(--text-dim); }
    .ops-panel li.active small { color: var(--green); }
    .ops-panel li.inactive small { color: var(--text-dim); }
    .tree-counts { display: flex; gap: 16px; margin-bottom: 8px; font-size: 13px; }
    .tree-counts span { color: var(--accent); }
    #plays-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #plays-table th { text-align: left; padding: 4px 8px; color: var(--text-dim); font-weight: 500; }
    #plays-table td { padding: 4px 8px; }
    #plays-table tbody tr:nth-child(odd) { background: var(--surface-hover); }
    .rail-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
    .ops-loading { text-align: center; padding: 80px 0; color: var(--text-dim); }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ops-banner { padding: 16px 20px; border-radius: var(--radius); margin-bottom: 16px; }
    .ops-banner.error { background: rgba(248,81,73,.1); border: 1px solid var(--red); }
    .ops-banner.hidden { display: none; }
    .ops-banner p { margin-bottom: 8px; }
    .error-hint { font-size: 12px; color: var(--text-dim); }
    .retry-btn { padding: 4px 16px; background: var(--accent-glow); border: 1px solid var(--accent); border-radius: 4px; color: var(--accent); cursor: pointer; }
    .retry-btn:hover { background: var(--accent); color: var(--bg); }
    .ops-source { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
    .hidden { display: none; }
    @media (max-width: 768px) { .ops-grid { grid-template-columns: 1fr; } .ops-panel.wide { grid-column: span 1; } }
  </style>
</head>
<body>

        <span class="logo-icon">■</span>
        <span class="brand-wordmark">FactoryWager</span>
        <span class="brand-badge">ops</span>
        <span class="logo-page">Ops</span>
      </h1>
      <nav class="topbar-nav" aria-label="Primary">
        <a href="/" class="nav-link">Home</a>
        <a href="/portal/ops" class="nav-link active">Ops</a>
        <a href="/portal/" class="nav-link">Registry</a>
        <a href="/portal/health" class="nav-link">Health</a>
        <a href="/portal/dod" class="nav-link">DOD</a>
        <div class="nav-overflow">
          <button type="button" class="nav-more" aria-label="More navigation" aria-expanded="false" aria-haspopup="true">⋯</button>
          <div class="nav-dropdown" role="menu">
            <a href="/portal/catalog" class="nav-link" role="menuitem">Catalog</a>
            <a href="/portal/skills" class="nav-link" role="menuitem">Skills</a>
            <a href="/portal/env" class="nav-link" role="menuitem">Env</a>
            <a href="/portal/dashboard" class="nav-link" role="menuitem">Dashboard</a>
            <a href="/monitoring" class="nav-link" role="menuitem">Monitoring</a>
            <a href="https://wiki.factory-wager.com" class="nav-link" target="_blank" rel="noopener noreferrer" role="menuitem">Wiki</a>
          </div>
        </div>
      </nav>
      <div class="topbar-status">
        <a href="/portal/ops.md" class="nav-link nav-md" title="Markdown view">MD</a>
        <a href="/portal/health" class="topbar-health-link" title="System health">
          <span id="health-dot" class="health-dot unknown" title="Health"></span>
          <span id="health-label" class="health-label">Health</span>
        </a>
      </div>
    </div>
  </header>
  <operations-dashboard></operations-dashboard>
  <script type="module" src="/portal/data.js"></script>
  <script type="module" src="/portal/topbar.js"></script>
  <script type="module" src="/portal/operations-dashboard.js"></script>
</body>
</html>
