<!DOCTYPE html>
<!-- @see docs/portal-foundation.md — copied from _page-template.html -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="portal-poll-ms" content="30000" />
  <title>Skills · FactoryWager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/portal/style.css" />
  <style>
    .hidden { display: none; }
    .skills-dashboard { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .stat-card .stat-num { font-size: 28px; font-weight: 600; }
    .stat-card .stat-label { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
    .filter-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    #search { padding: 6px 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); font-size: 13px; width: 280px; }
    .skills-table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .skills-table th, .skills-table td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
    .skills-table th { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-dim); }
    .skills-table tr:last-child td { border-bottom: none; }
    .skill-name { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--accent); white-space: nowrap; }
    .skill-desc { color: var(--text); }
    .skill-updated { color: var(--text-dim); white-space: nowrap; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    .pkg-link { font-size: 12px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; white-space: nowrap; }
    .pkg-link:hover { background: var(--accent-glow); }
    .pkg-none { color: var(--text-dim); font-size: 12px; }
    .ops-banner.error { margin-bottom: 16px; }
    @media (max-width: 768px) { .stats-row { grid-template-columns: 1fr; } .skill-desc { max-width: none; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="logo">
        <span class="logo-icon">■</span>
        <span class="brand-wordmark">FactoryWager</span>
        <span class="brand-badge">ops</span>
        <span class="logo-page">Skills</span>
      </h1>
      <nav class="topbar-nav" aria-label="Primary">
        <a href="/" class="nav-link">Home</a>
        <a href="/portal/ops" class="nav-link">Ops</a>
        <a href="/portal/" class="nav-link">Registry</a>
        <a href="/portal/health" class="nav-link">Health</a>
        <a href="/portal/dod" class="nav-link">DOD</a>
        <div class="nav-overflow">
          <button type="button" class="nav-more" aria-label="More navigation" aria-expanded="false" aria-haspopup="true">⋯</button>
          <div class="nav-dropdown" role="menu">
            <a href="/portal/catalog" class="nav-link" role="menuitem">Catalog</a>
            <a href="/portal/skills" class="nav-link active" role="menuitem">Skills</a>
            <a href="/portal/env" class="nav-link" role="menuitem">Env</a>
            <a href="/portal/dashboard" class="nav-link" role="menuitem">Dashboard</a>
            <a href="/monitoring" class="nav-link" role="menuitem">Monitoring</a>
            <a href="https://wiki.factory-wager.com" class="nav-link" target="_blank" rel="noopener noreferrer" role="menuitem">Wiki</a>
          </div>
        </div>
      </nav>
      <div class="topbar-status">
        <a href="/portal/skills.md" class="nav-link nav-md" title="Markdown view">MD</a>
        <a href="/portal/health" class="topbar-health-link" title="System health">
          <span id="health-dot" class="health-dot unknown"></span>
          <span id="health-label" class="health-label">Connecting…</span>
        </a>
      </div>
    </div>
  </header>

  <main class="skills-dashboard">
    <div id="error-banner" class="ops-banner error hidden"></div>
    <div id="loading" class="ops-loading"><div class="spinner"></div><p>Loading skills…</p></div>
    <div id="dashboard" class="hidden">
      <div class="stats-row">
        <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-label">skills installed</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-packages">0</div><div class="stat-label">downloadable packages</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-updated">—</div><div class="stat-label">latest update</div></div>
      </div>
      <div class="filter-row">
        <input type="text" id="search" placeholder="Search name or description…" />
      </div>
      <table class="skills-table">
        <thead>
          <tr><th>Name</th><th>Description</th><th>Updated</th><th>Package</th></tr>
        </thead>
        <tbody id="skills-body"></tbody>
      </table>
    </div>
  </main>

  <notification-center aria-live="polite"></notification-center>

  <footer class="footer">
    <p>FactoryWager · <a href="https://github.com/brendadeeznuts1111/project-R-score">GitHub</a></p>
  </footer>

  <script type="module">
    const $ = id => document.getElementById(id);
    let skills = [];

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function load() {
      try {
        const res = await fetch('/api/skills');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        skills = data.skills ?? [];
        if (data.warning) {
          $('error-banner').innerHTML = `<p>⚠️ ${esc(data.warning)}${data.error ? ` <code>${esc(data.error)}</code>` : ''}</p>`;
          $('error-banner').classList.remove('hidden');
        }
        render();
        return;
      } catch (err) {
        $('error-banner').innerHTML = `<p>⚠️ Could not load /api/skills — ${esc(err?.message ?? err)}</p>`;
        $('error-banner').classList.remove('hidden');
        $('loading').classList.add('hidden');
      }
    }

    function render() {
      $('loading').classList.add('hidden');
      $('dashboard').classList.remove('hidden');
      renderStats();
      renderTable();
    }

    function renderStats() {
      $('stat-total').textContent = skills.length;
      $('stat-packages').textContent = skills.filter(s => s.hasPackage).length;
      const latest = skills.reduce((m, s) => Math.max(m, Date.parse(s.updatedAt) || 0), 0);
      $('stat-updated').textContent = latest ? new Date(latest).toLocaleDateString() : '—';
    }

    function renderTable() {
      const q = ($('search').value || '').toLowerCase();
      const filtered = skills.filter(s =>
        !q || s.name.toLowerCase().includes(q) || (s.description || '').toLowerCase().includes(q)
      );
      $('skills-body').innerHTML = filtered.length
        ? filtered.map(s => `
          <tr>
            <td class="skill-name">${esc(s.name)}</td>
            <td class="skill-desc">${esc(s.description) || '—'}</td>
            <td class="skill-updated">${s.updatedAt ? esc(new Date(s.updatedAt).toLocaleString()) : '—'}</td>
            <td>${s.hasPackage
              ? `<a class="pkg-link" href="/skills/${encodeURIComponent(s.name)}.skill">.skill ↓</a>`
              : '<span class="pkg-none">—</span>'}</td>
          </tr>
        `).join('')
        : '<tr><td colspan="4" style="text-align:center;padding:40px 0;color:var(--text-dim)">No skills found.</td></tr>';
    }

    $('search').addEventListener('input', renderTable);
    load();
  </script>
  <script type="module" src="/portal/data.js"></script>
  <script type="module" src="/portal/topbar.js"></script>
</body>
</html>
