# Manual diagnostic only. Local `bun run bun:ci` is merge authority because
# hosted runners are billing-blocked for this repository.
name: check (manual diagnostic)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
        env:
          RESEARCH_SKIP_RATE_PREFLIGHT: "1"
      # Bun 1.4 gates (read-only, frozenLockfile-safe): security advisory scan +
      # lockfile dedupe check. Mutating forms (bun audit fix / bun dedupe)
      # conflict with bunfig frozenLockfile and are run manually.
      - name: Security audit (high+)
        run: bun audit --audit-level=high
      - name: Lockfile dedupe check
        run: bun dedupe --check
